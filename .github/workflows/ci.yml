name: CI

on:
  pull_request:
  push:
    branches: main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pesde
        uses: lumin-org/setup-pesde@v0.4.1

      - name: Install dependencies
        run: pesde install --locked

      - name: Lint
        run: selene src

      - name: Check formatting
        run: stylua -c .

      - name: Fetch Roblox type definitions
        run: curl -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau

      - name: Generate Rojo sourcemap
        run: rojo sourcemap -o sourcemap.json

      - name: Typecheck
        run: luau_lsp analyze --definitions=globalTypes.d.luau --sourcemap=sourcemap.json src
