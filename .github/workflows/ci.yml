name: CI

on:
  pull_request:
  push:
    branches: main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pesde
        uses: lumin-org/setup-pesde@v0.4.1

      - name: Install dependencies
        run: pesde install --locked

      - name: Lint
        run: selene src

      - name: Check formatting
        run: stylua -c .
